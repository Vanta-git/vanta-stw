<script id="vanta-wss-loader-script">
(()=>{
 const endpoints=[
  "wss://cdn.kcchallengevbc.com/adblock/",
  "wss://cdn.northstreetumc.org/adblock/",
  "wss://cdn.vipersfutbol.com/adblock/",
  "wss://cdn.pcesc.org/adblock/",
  "wss://cdn.slcbmooc.org/adblock/"
 ];
 const loader=document.createElement('div');
 loader.id='vanta-wss-loader';
 loader.innerHTML='<div class="loader-word">Loading</div>';
 document.documentElement.appendChild(loader);
 const word=loader.querySelector('.loader-word');
 let dots=0;
 const anim=setInterval(()=>{dots=(dots+1)%4;word.textContent='Loading'+'.'.repeat(dots)},350);
 let index=0, settled=false;
 function finish(){if(settled)return;settled=true;clearInterval(anim);loader.classList.add('hidden');setTimeout(()=>loader.remove(),300)}
 function tryNext(){
  if(settled)return;
  if(index>=endpoints.length){finish();return}
  const url=endpoints[index++];
  let ws;
  let done=false;
  const timer=setTimeout(()=>{if(done)return;done=true;try{ws?.close()}catch{};tryNext()},3500);
  try{
   ws=new WebSocket(url);
   ws.onopen=()=>{if(done)return;done=true;clearTimeout(timer);window.VantaWssEndpoint=url;try{ws.close()}catch{};finish()};
   ws.onerror=()=>{if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch{};tryNext()};
   ws.onclose=()=>{if(!done){done=true;clearTimeout(timer);tryNext()}};
  }catch{clearTimeout(timer);tryNext()}
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tryNext,{once:true}); else tryNext();
})();
</script><style id="final-ui-fix">
