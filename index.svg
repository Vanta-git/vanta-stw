<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     style="width:100vw;height:100vh;display:block;margin:0;padding:0;background:#000;">
  <xhtml:style>
    html, body { margin:0 !important; padding:0 !important; width:100% !important; height:100% !important; overflow:hidden !important; background:#000 !important; }
    iframe { display:block; width:100vw; height:100vh; border:0; margin:0; padding:0; }
  </xhtml:style>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:iframe src="./index.html" frameborder="0" scrolling="auto"
      style="display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:#000;"></xhtml:iframe>
  </foreignObject>
</svg>
